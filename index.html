<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1b2a">
<title>Meniu • Pește și Fructe de Mare</title>
<meta name="description" content="Meniu: pește, fructe de mare, preparate la grătar.">
<style>
:root{--bg:#0f1b2a;--card:#12223a;--gold:#c9a96e;--text:#f4f1ea;--muted:#9fb0c4;--line:rgba(201,169,110,.45)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;line-height:1.35;padding:max(14px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom))}
.frame{max-width:1180px;margin:0 auto;border:1px solid var(--line);padding:26px 14px 22px}
header{text-align:center;margin-bottom:22px}
h1{color:var(--gold);font-size:2.4rem;letter-spacing:.14em;font-weight:800}
.sub{font-size:.72rem;letter-spacing:.16em;margin-top:6px}
.rule{width:60%;height:1px;background:var(--line);margin:18px auto 0}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
.card{background:var(--card);border:1px solid var(--line);padding:16px 16px 12px}
h2{color:var(--gold);font-size:1.05rem;letter-spacing:.08em;text-transform:uppercase;font-weight:800;text-align:center;margin-bottom:10px}
.note{text-align:center;font-size:.85rem;margin-bottom:6px}
.pick{text-align:center;color:var(--gold);font-weight:700;font-size:.95rem;padding:8px 0;margin:6px 0 4px;border-top:1px solid var(--line)}
ul{list-style:none}
li{display:flex;align-items:baseline;gap:6px;padding:5px 0;font-size:.92rem}
li .n{flex:0 1 auto}
li .d{flex:1;border-bottom:1px dotted rgba(244,241,234,.28);transform:translateY(-3px);min-width:8px}
li .p{color:var(--gold);font-weight:700;white-space:nowrap}
li .p small{color:var(--muted);font-weight:400;font-size:.72rem}
.boil li{padding:6px 0}
footer{text-align:center;color:var(--muted);font-size:.68rem;letter-spacing:.14em;margin-top:20px;text-transform:uppercase}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr;align-items:start}.frame{padding:36px 30px 26px}h1{font-size:3rem}}
@media(min-width:1050px){.grid{grid-template-columns:repeat(3,1fr)}li{font-size:.88rem}}
</style>
</head>
<body>

</script>
</body>
</html>
