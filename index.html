footer{text-align:center;color:var(--muted);font-size:.68rem;letter-spacing:.14em;margin-top:20px;text-transform:uppercase}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr;align-items:start}.frame{padding:36px 30px 26px}h1{font-size:3rem}}
